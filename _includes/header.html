<header>
  <div class="container">
    <a href="{{ site.baseurl }}/" class="logo">
      {% if site.logo %}
        <img src="{{ site.baseurl }}/assets/images/logo.png" alt="{{ site.title }}">
      {% else %}
        <h1>{{ site.title }}</h1>
      {% endif %}
    </a>
    
    <nav>
      <ul>
        {% for page in site.header_pages %}
          <li>
            <a href="{{ site.baseurl }}/{{ page | remove: '.md' }}" 
               {% if page == "index.md" %}class="active"{% endif %}>
              {{ page | replace: '.md', '' | capitalize }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
